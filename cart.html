<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart · Decoture</title>
  <meta name="description" content="Your Decoture cart.">
  <meta name="theme-color" content="#1c2321">
  <link rel="icon" href="assets/img/logo/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="cart">
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-site-header></header>

  <main id="main" tabindex="-1">
    <div class="page-head">
      <h1>Your cart</h1>
      <p>Chairs are held for you once our team confirms the order by phone.</p>
    </div>
    <div class="two-col" data-cart-page>
      <div data-cart-lines></div>
      <aside class="summary" aria-labelledby="sum-title">
        <h2 id="sum-title">Order summary</h2>
        <div data-cart-totals></div>
        <a class="button button--block" href="checkout.html" data-checkout-link>Checkout · cash on delivery</a>
        <a class="link small" href="shop.html">Keep shopping</a>
      </aside>
    </div>
  </main>

  <footer data-site-footer></footer>

  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/cart.js"></script>
</body>
</html>
